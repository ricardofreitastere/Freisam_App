  :root {

    --primary-dark: #124a28;
    --primary-light: #e8f5ee;
    --accent: #e09f1f;
    --danger: #c62828;
    --danger-light: #fdecea;
    --warn: #d98200;
    --warn-light: #fff6e0;
    --ok: #1b6b3a;
    --ok-light: #e7f6ed;
    --bg: #f3f6f4;

    --text: #162019;

  .muted {

    font-weight: 700;

    font-size: 12px;
    border: 1px solid #444;
    padding: 10px;
    background: #fff;
  }

  @media print {
    body * { visibility: hidden; }
    #printable-zone, #printable-zone * { visibility: visible; }
    #printable-zone {

      left: 0;
      top: 0;

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const init = createInitialState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
      return init;
    }
    const parsed = JSON.parse(raw);
    return Object.assign(createInitialState(), parsed);
  } catch (e) {
    return createInitialState();
  }
}

function saveState(msg = "Sincronizado • Local") {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const el = document.getElementById("sync-indicator");
    if (el) el.textContent = msg;
  } catch (e) {
    const el = document.getElementById("sync-indicator");
    if (el) el.textContent = "Aviso de armazenamento";
  }
}

function formatBRL(val) {
  const n = Number(val || 0);
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function openModal(title, html) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-backdrop").classList.remove("open");
}

function triggerPrintHtml(innerHtml, is80mm = false) {
  const zone = document.getElementById("printable-zone");
  zone.innerHTML = is80mm
    ? `<div class="print-80mm">${innerHtml}</div>`
    : `<div class="print-area">${innerHtml}</div>`;
  zone.style.display = "block";
  window.print();
  setTimeout(() => {
    zone.style.display = "none";
    zone.innerHTML = "";
  }, 500);
}

function setTab(tab) {
  state.activeTab = tab;
  saveState();
  render();
}

function logoutSession() {
  state.session.role = null;
  state.session.userName = "";
  state.session.userId = null;
  state.activeTab = "login";
  saveState();
  render();
}

function renderTopChrome() {
  document.getElementById("top-company-name").textContent = state.company.name || "Freisam App";
  const initials = (state.company.name || "FS")
    .split(/\s+/)
    .slice(0, 2)
    .map(w => w[0] || "")
    .join("")
    .toUpperCase() || "FS";
  document.getElementById("top-logo").textContent = initials;

  const banner = document.getElementById("greeting-banner");
  if (state.session.role) {
    banner.style.display = "flex";
    const roleLabel =
      state.session.role === "adm_master" ? "ADM Master" :
      state.session.role === "adm_2" ? "2º Admin" :
      state.session.role === "clb" ? "Colaborador (CLB)" : "Cliente";
    document.getElementById("greeting-text").textContent =
      `Bem-vindo, ${state.session.userName} • Perfil: ${roleLabel}`;
  } else {
    banner.style.display = "none";
  }

  const nav = document.getElementById("main-nav");
  const buttons = [
    { id: "login", label: "Acesso / PIN" },
    { id: "client", label: "Painel Cliente" },
    { id: "adm", label: "Painel ADM" }
  ];
  nav.innerHTML = buttons.map(b =>
    `<button class="nav-btn ${state.activeTab === b.id ? "active" : ""}" onclick="setTab('${b.id}')">${b.label}</button>`
  ).join("");
}

function render() {
  renderTopChrome();
  const container = document.getElementById("view-container");
  if (state.activeTab === "client") {
    container.innerHTML = renderClientView();
  } else if (state.activeTab === "adm") {
    container.innerHTML = renderAdmView();
  } else {
    container.innerHTML = renderLoginView();
  }
  window.scrollTo({ top: 0, behavior: "instant" });
}

function loginByPin() {
  const pin = (document.getElementById("pin-input").value || "").trim();
  const user = state.users.find(u => u.active && u.pin === pin);
  if (!user) {
    openModal("PIN não encontrado", `<p>Nenhum usuário ativo encontrado com o PIN informado.</p><p class="muted">Dica de teste: ADM Master = 1111, 2º Admin = 2222, Colaborador = 3333.</p>`);
    return;
  }
  state.session.role = user.role;
  state.session.userName = user.name;
  state.session.userId = user.id;

  // Verifica aniversariantes no dia
  const today = new Date();
  const dd = String(today.getDate()).padStart(2, "0");
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const todayDm = `${dd}/${mm}`;
  const bdays = state.users.filter(u => u.birthday === todayDm);

  state.activeTab = user.role === "clb" ? "adm" : "adm";
  saveState();
  render();

  if (bdays.length > 0) {
    openModal("Aniversário do dia", `<p>Hoje é aniversário de: <strong>${bdays.map(b => escapeHtml(b.name)).join(", ")}</strong>!</p>`);
  }
}

function loginAsClient() {
  const id = document.getElementById("client-select").value;
  const cli = state.clients.find(c => c.id === id);
  if (!cli) return;
  state.session.role = "client";
  state.session.userName = cli.name;
  state.session.userId = cli.id;
  state.session.clientSince = cli.since;
  state.activeTab = "client";
  saveState();
  render();
}

function requestClientAccess() {
  const name = (document.getElementById("req-client-name").value || "").trim();
  const city = (document.getElementById("req-client-city").value || "").trim();
  const phone = (document.getElementById("req-client-phone").value || "").trim();
  if (!name) {
    openModal("Atenção", "<p>Informe o nome do cliente ou estabelecimento.</p>");
    return;
  }
  state.notices.unshift({
    id: "n_" + Date.now(),
    title: "Solicitação de acesso de cliente",
    text: `${name} (${city || "Cidade não informada"}) solicitou acesso. WhatsApp: ${phone || "não informado"}.`,
    priority: "urgent",
    requiresAccessApproval: true,
    pendingClientName: name,
    pendingCity: city || "Não informada",
    pendingPhone: phone || ""
  });
  saveState("Novo aviso de acesso enviado");
  openModal("Solicitação enviada", "<p>Seu pedido foi enviado para a <strong>Caixa de Avisos</strong> do ADM para liberação direta.</p>");
}

function runCalc() {
  const expr = (document.getElementById("calc-expr").value || "").trim();
  const out = document.getElementById("calc-result");
  if (!/^[0-9+\-*/().\s]+$/.test(expr)) {
    out.textContent = "Expressão inválida";
    return;
  }
  try {
    const val = Function(`"use strict"; return (${expr});`)();
    out.textContent = Number.isFinite(val) ? `= ${val}` : "Erro";
  } catch (e) {
    out.textContent = "Erro";
  }
}

function filterClientCatalog() {
  const q = (document.getElementById("cat-search").value || "").toLowerCase().trim();
  document.querySelectorAll(".client-prod-item").forEach(el => {
    const hay = el.getAttribute("data-search") || "";
    el.style.display = hay.includes(q) ? "block" : "none";
  });
}

function stepClientQty(prodId, delta) {
  const inp = document.getElementById("cqty_" + prodId);
  if (!inp) return;
  const next = Math.max(0, (parseInt(inp.value, 10) || 0) + delta);
  inp.value = next;
}

function sendClientOrderWhatsApp() {
  const selected = [];
  let total = 0;
  state.products.forEach(p => {
    const inp = document.getElementById("cqty_" + p.id);
    const qty = inp ? (parseFloat(inp.value) || 0) : 0;
    if (qty > 0) {
      const unitPrice = p.cost * (1 + (p.margin || 0) / 100);
      const sub = qty * unitPrice;
      total += sub;
      selected.push(`${qty} ${p.unit} de ${p.name} (${formatBRL(sub)})`);
    }
  });
  if (selected.length === 0) {
    openModal("Pedido vazio", "<p>Selecione pelo menos 1 item antes de enviar.</p>");
    return;
  }
  const prio = document.getElementById("order-priority").value;
  const prioText = prio === "urgent" ? "URGENTE (Vermelho)" : "NORMAL (Amarelo)";
  const clientLabel = state.session.role === "client" ? state.session.userName : "Cliente";

  const newOrder = {
    id: "ord_" + Date.now(),
    date: new Date().toLocaleDateString("pt-BR"),
    clientName: clientLabel,
    priority: prio,
    total: Number(total.toFixed(2)),
    paid: false,
    pixCode: state.company.pixKeyDefault || "00000000000",
    items: selected
  };
  state.orders.unshift(newOrder);
  saveState("Pedido registrado");

  const msg = encodeURIComponent(
    `*Pedido - ${state.company.name}*
Cliente: ${clientLabel}
Prioridade: ${prioText}
Itens:
- ${selected.join("
- ")}
*Total estimado: ${formatBRL(total)}*`
  );
  const phone = state.company.phoneWhats || "5500000000000";
  window.open(`https://wa.me/${phone}?text=${msg}`, "_blank");
}

/* Modais do Cliente */
function openClientNoticesModal() {
  if (state.notices.length === 0) {
    openModal("Avisos", "<p class='muted'>Nenhum aviso pendente no momento.</p>");
    return;
  }
  const html = state.notices.map(n => `
    <div class="notice-item ${n.priority === "urgent" ? "urgent" : ""}">
      <strong>${escapeHtml(n.title)}</strong>
      <p style="margin:4px 0 8px 0;">${escapeHtml(n.text)}</p>
      <button class="btn btn-primary btn-sm" onclick="ackNotice('${n.id}')">Estou ciente</button>
    </div>
  `).join("");
  openModal("Caixa de Avisos", html);
}

function ackNotice(noticeId) {
  const idx = state.notices.findIndex(n => n.id === noticeId);
  if (idx === -1) return;
  const notice = state.notices[idx];

  // Se for solicitacao de acesso de cliente e estiver no ADM, abre Sim / Nao direto
  if (notice.requiresAccessApproval && (state.session.role === "adm_master" || state.session.role === "adm_2")) {
    closeModal();
    openModal(
      "Liberar acesso do cliente?",
      `
        <p>Você marcou <strong>Estou ciente</strong> no pedido de acesso:</p>
        <p><strong>${escapeHtml(notice.pendingClientName)}</strong> — ${escapeHtml(notice.pendingCity)}</p>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="decideClientAccess('${notice.id}', true)">Sim — Liberar acesso</button>
          <button class="btn btn-danger" onclick="decideClientAccess('${notice.id}', false)">Não — Recusar</button>
        </div>
      `
    );
    return;
  }

  state.notices.splice(idx, 1);
  saveState("Aviso confirmado");
  openClientNoticesModal();
  if (state.activeTab === "adm") render();
}

function decideClientAccess(noticeId, approved) {
  const idx = state.notices.findIndex(n => n.id === noticeId);
  if (idx === -1) return;
  const n = state.notices[idx];
  if (approved) {
    state.clients.push({
      id: "c_" + Date.now(),
      name: n.pendingClientName || "Novo Cliente",
      city: n.pendingCity || "Não informada",
      routeId: state.routes[0] ? state.routes[0].id : "r_1",
      since: new Date().toLocaleDateString("pt-BR"),
      approved: true,
      phone: n.pendingPhone || ""
    });
  }
  state.notices.splice(idx, 1);
  saveState(approved ? "Acesso liberado" : "Acesso recusado");
  closeModal();
  render();
}

/* ---------------- PAINEL ADM & BALOES ---------------- */
function renderAdmView() {
  const role = state.session.role;
  const isClb = role === "clb";
  const currentUser = state.users.find(u => u.id === state.session.userId);

  const visibleBalloons = state.admBalloons.filter(b => {
    if (!role || role === "adm_master" || role === "adm_2") return true;
    if (isClb) {
      if (b.isSecurity) return false;
      if (currentUser && Array.isArray(currentUser.balloons)) {
        return currentUser.balloons.includes(b.id);
      }
      return !!b.clbAllowed;
    }
    return !b.isSecurity;
  });

  const urgentNoticesCount = state.notices.filter(n => n.requiresAccessApproval || n.priority === "urgent").length;

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">

/* 1. Rotas & Prep Carga */
function openRotasPrepModal() {
  const route = state.routes[0];
  const queueHtml = (route.queue || []).map((q, idx) => `
    <div class="list-row" style="border-left:4px solid ${q.done ? "var(--ok)" : (idx === 0 ? "var(--accent)" : "#c5d1ca")};">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <strong>#${idx + 1} ${escapeHtml(q.clientName)} (${escapeHtml(q.city)})</strong>
        <span class="badge ${q.done ? "badge-ok" : "badge-warn"}">${q.done ? "Separado ✓" : "Na fila"}</span>
      </div>
      <div>Item: <strong>${escapeHtml(q.productName)}</strong> — Qtd: <strong>${q.qty}</strong> ${q.resistant ? '<span class="badge badge-ok">Resistente</span>' : ""}</div>
      <div class="btn-row">
        <button class="btn btn-primary btn-sm" onclick="toggleQueueDone('${q.id}')">${q.done ? "Desmarcar" : "✓ Marcar Separado"}</button>
      </div>
    </div>
  `).join("");

  openModal("Rotas & Prep Carga", `
    <p><strong>Rota ativa:</strong> ${escapeHtml(route.name)} • Destino final: <strong>${escapeHtml(route.lastCity)}</strong> • Status: <span class="badge badge-warn">${escapeHtml(route.status)}</span></p>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="startRouteDelivery()">Iniciar Rota / Navegar</button>
      <button class="btn btn-secondary btn-sm" onclick="finishLoadTo80mm()">Concluir Carga (Fila PC 80mm)</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">
    <div class="card-title">Fila de Separação em Cascata</div>
    ${queueHtml}
  `);
}

function toggleQueueDone(qId) {
  const route = state.routes[0];
  const item = route.queue.find(x => x.id === qId);
  if (!item) return;
  item.done = !item.done;
  saveState("Separação atualizada");
  openRotasPrepModal();
}

function startRouteDelivery() {
  const route = state.routes[0];
  const kmInput = prompt(`Informe a KM do painel para iniciar a rota (${route.vehiclePlate}):`, state.vehicles[0] ? state.vehicles[0].km : "0");
  if (kmInput === null) return;
  const kmNum = parseInt(kmInput, 10);
  if (Number.isFinite(kmNum) && kmNum > 0 && state.vehicles[0]) {
    state.vehicles[0].km = kmNum;
  }
  route.status = "Em rota";
  saveState("Rota iniciada");
  closeModal();
  window.open(`https://waze.com/ul?q=${encodeURIComponent(route.lastCity)}&navigate=yes`, "_blank");
}

function finishLoadTo80mm() {
  const route = state.routes[0];
  const lines = route.queue.map(q => `${q.done ? "[X]" : "[ ]"} ${q.qty}x ${q.productName} (${q.clientName})`).join("<br>");
  triggerPrintHtml(`
    <div style="text-align:center;"><strong>${escapeHtml(state.company.name)}</strong><br>ROMANEIO DE CARGA (80mm)</div>
    <hr>
    <div>Rota: ${escapeHtml(route.name)}<br>Destino: ${escapeHtml(route.lastCity)}</div>
    <hr>
    <div>${lines}</div>
  `, true);
}

function savePurchase() {
  const supName = document.getElementById("pur-sup").value;
  const prodId = document.getElementById("pur-prod").value;
  const qty = parseFloat(document.getElementById("pur-qty").value) || 0;
  const status = document.getElementById("pur-status").value;
  const prod = state.products.find(p => p.id === prodId);
  if (!prod || qty <= 0) return;

  prod.stock = Number((prod.stock + qty).toFixed(2));
  const total = Number((prod.cost * qty).toFixed(2));

  if (status === "Paga") {
    state.company.meiUsedAnnual = Number((Number(state.company.meiUsedAnnual || 0) + total).toFixed(2));
  }

  state.purchases.unshift({
    id: "pur_" + Date.now(),
    date: new Date().toLocaleDateString("pt-BR"),
    supplierName: supName,
    itemName: prod.name,
    qty,
    costTotal: total,
    status,
    dueDate: status === "Agendada" ? "Próximo vencimento" : ""
  });
  saveState("Compra registrada");
  openComprasModal();
}

function createSaleOrder() {
  const clientName = document.getElementById("sale-client").value;
  const prodId = document.getElementById("sale-prod").value;
  const qty = parseFloat(document.getElementById("sale-qty").value) || 0;
  const mode = document.getElementById("sale-mode").value;
  const prod = state.products.find(p => p.id === prodId);
  if (!prod || qty <= 0) return;

  const basePrice = prod.cost * (1 + (prod.margin || 0) / 100);
  const unitPrice = mode === "prazo10" ? basePrice * 1.10 : basePrice;
  const total = Number((unitPrice * qty).toFixed(2));

  prod.stock = Math.max(0, Number((prod.stock - qty).toFixed(2)));
  prod.lastSaleAt = Date.now();
  state.company.meiUsedAnnual = Number((Number(state.company.meiUsedAnnual || 0) + total).toFixed(2));

  state.orders.unshift({
    id: "ord_" + Date.now(),
    date: new Date().toLocaleDateString("pt-BR"),
    clientName,
    priority: "normal",
    total,
    paid: false,
    pixCode: state.company.pixKeyDefault || "00000000000",
    items: [{ name: prod.name, qty, price: unitPrice }]
  });
  saveState("Venda registrada");
  openVendasModal();
}

      `).join("")
    : "<p class='muted'>Nenhuma nota em aberto no momento.</p>";

function settleOrder(orderId) {
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  o.paid = true;
  saveState("Nota quitada");
  openReceberModal();
}

function partialOrder(orderId) {
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  const val = parseFloat(prompt(`Valor a abater (Saldo atual: ${formatBRL(o.total)}):`, "10") || "0") || 0;
  if (val <= 0) return;
  o.total = Math.max(0, Number((o.total - val).toFixed(2)));
  if (o.total === 0) o.paid = true;
  saveState("Valor abatido");
  openReceberModal();
}

function sendPixReminderNotice(orderId) {
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  state.notices.unshift({
    id: "n_" + Date.now(),
    title: `Lembrete de pagamento — ${o.clientName}`,
    text: `Saldo em aberto: ${formatBRL(o.total)}. Pix: ${o.pixCode || state.company.pixKeyDefault}`,
    priority: "normal",
    requiresAccessApproval: false
  });
  saveState("Aviso Pix enviado");
  openModal("Aviso enviado", "<p>Lembrete com código Pix adicionado à Caixa de Avisos.</p>");
}

function promoteScheduled(sdId) {
  const idx = state.scheduledDeliveries.findIndex(x => x.id === sdId);
  if (idx === -1) return;
  const sd = state.scheduledDeliveries[idx];
  state.orders.unshift({
    id: "ord_prog_" + Date.now(),
    date: new Date().toLocaleDateString("pt-BR"),
    clientName: sd.clientName,
    priority: "normal",
    total: 150.00,
    paid: false,
    pixCode: state.company.pixKeyDefault,
    items: [sd.summary]
  });
  state.routes[0].queue.push({
    id: "q_prog_" + Date.now(),
    clientName: sd.clientName,
    city: sd.city,
    productName: sd.summary,
    qty: 1,
    done: false,
    resistant: false
  });
  state.scheduledDeliveries.splice(idx, 1);
  saveState("Entrega promovida");
  openProgramadasModal();
}

const CLT_WIZARD_STEPS = [
  { key: "nomeCompleto", label: "1. Nome completo do colaborador", placeholder: "Digite o nome completo" },
  { key: "cpf", label: "2. CPF", placeholder: "000.000.000-00" },
  { key: "rg", label: "3. RG / Órgão emissor", placeholder: "Número e órgão" },
  { key: "pis", label: "4. PIS / NIS", placeholder: "Número do PIS" },
  { key: "endereco", label: "5. Endereço completo", placeholder: "Rua, número, bairro, cidade" },
  { key: "cargoCbo", label: "6. Cargo e CBO (para o contador)", placeholder: "Ex.: Auxiliar de logística" },
  { key: "salario", label: "7. Salário base (R$)", placeholder: "Ex.: 1900.00" },
  { key: "jornada", label: "8. Jornada e escala de trabalho", placeholder: "Ex.: Seg a Sex 08h-17h" }
];

let cltWizardIndex = 0;
let cltWizardDraft = {};

function openGuidedCltWizard() {
  cltWizardIndex = 0;
  cltWizardDraft = {};
  renderCltWizardStep();
}

function renderCltWizardStep() {
  const step = CLT_WIZARD_STEPS[cltWizardIndex];
  const currentVal = cltWizardDraft[step.key] || "";
  openModal(`Cadastrar Padrão CLT (${cltWizardIndex + 1}/${CLT_WIZARD_STEPS.length})`, `
    <div class="field-group">
      <label for="clt-step-input">${escapeHtml(step.label)}</label>
      <input id="clt-step-input" type="text" value="${escapeHtml(currentVal)}" placeholder="${escapeHtml(step.placeholder)}"
        onkeydown="if(event.key==='ArrowDown' || event.key==='Enter'){ event.preventDefault(); nextCltStep(); }">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-sm" onclick="nextCltStep()">↓ Próximo campo</button>
      <button class="btn btn-primary btn-sm" onclick="nextCltStep()">Próximo</button>
    </div>
    <div class="muted" style="margin-top:8px;">Dica: use a setinha para baixo (↓) ou toque em Próximo até concluir.</div>
  `);
  setTimeout(() => {
    const inp = document.getElementById("clt-step-input");
    if (inp) inp.focus();
  }, 50);
}

function nextCltStep() {
  const inp = document.getElementById("clt-step-input");
  const step = CLT_WIZARD_STEPS[cltWizardIndex];
  if (inp) cltWizardDraft[step.key] = inp.value.trim();

  if (cltWizardIndex < CLT_WIZARD_STEPS.length - 1) {
    cltWizardIndex++;
    renderCltWizardStep();
  } else {
    state.users.push({
      id: "u_clt_" + Date.now(),
      name: cltWizardDraft.nomeCompleto || "Colaborador CLT",
      role: "clb",
      pin: String(Math.floor(1000 + Math.random() * 9000)),
      birthday: "01/01",
      functionRole: "Padrão CLT",
      active: true,
      balloons: ["b_rotas", "b_retornos"],
      cltData: Object.assign({}, cltWizardDraft)
    });
    saveState("Ficha CLT salva");
    openModal("Ficha Padrão CLT Concluída", `<p>Dados registrados para envio ao contador:</p><pre style="white-space:pre-wrap;font-size:12px;">${escapeHtml(JSON.stringify(cltWizardDraft, null, 2))}</pre>`);
  }
}

function saveCompanyEdits() {
  state.company.name = (document.getElementById("emp-name").value || state.company.name).trim();
  state.company.cnpjMei = (document.getElementById("emp-cnpj").value || state.company.cnpjMei).trim();
  state.company.phoneWhats = (document.getElementById("emp-wpp").value || state.company.phoneWhats).trim();
  saveState("Empresa atualizada");
  renderTopChrome();
  openModal("Salvo", "<p>Dados da empresa atualizados.</p>");
}

function resetAppToZero() {
  if (!confirm("Tem certeza que deseja redefinir o aplicativo e limpar os dados para uma nova empresa?")) return;
  const fresh = createInitialState();
  fresh.creator = Object.assign({}, state.creator);
  fresh.products = [];
  fresh.clients = [];
  fresh.suppliers = [];
  fresh.orders = [];
  fresh.purchases = [];
  fresh.expenses = [];
  fresh.reclames = [];
  fresh.notices = [];
  fresh.returns = [];
  fresh.scheduledDeliveries = [];
  fresh.company.name = "Nova Empresa";
  fresh.company.meiUsedAnnual = 0;
  fresh.activeTab = "login";
  fresh.session = { role: null, userName: "", userId: null, clientSince: new Date().toLocaleDateString("pt-BR") };
  state = fresh;
  saveState("Aplicativo redefinido");
  closeModal();
  render();
}

render();
</script>
