    --primary: #1b6b3a;
    --primary-dark: #124a28;
    --primary-light: #e8f5ee;
    --accent: #e09f1f;
    --danger: #c62828;
    --danger-light: #fdecea;
    --warn: #d98200;
    --warn-light: #fff6e0;
    --ok: #1b6b3a;

    padding: 10px 14px;

    justify-content: center;

    font-size: 12px;

  @media print {
    body * { visibility: hidden; }
    #printable-zone, #printable-zone * { visibility: visible; }
    #printable-zone {

      left: 0;
      top: 0;
      width: 100%;

var state = loadState();

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      var init = createInitialState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
      return init;
    }
    var parsed = JSON.parse(raw);
    return Object.assign(createInitialState(), parsed);
  } catch (e) {
    return createInitialState();
  }
}

function saveState(msg) {
  if (!msg) msg = "Sincronizado - Local";
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    var el = document.getElementById("sync-indicator");
    if (el) el.textContent = msg;
  } catch (e) {
    var el2 = document.getElementById("sync-indicator");
    if (el2) el2.textContent = "Aviso de armazenamento";
  }
}

function formatBRL(val) {
  var n = Number(val || 0);
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function openModal(title, html) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-backdrop").classList.remove("open");
}

function triggerPrintHtml(innerHtml, is80mm) {
  var zone = document.getElementById("printable-zone");
  zone.innerHTML = is80mm
    ? '<div class="print-80mm">' + innerHtml + '</div>'
    : '<div class="print-area">' + innerHtml + '</div>';
  zone.style.display = "block";
  window.print();
  setTimeout(function() {
    zone.style.display = "none";
    zone.innerHTML = "";
  }, 500);
}

function setTab(tab) {
  state.activeTab = tab;
  saveState();
  render();
}

function logoutSession() {
  state.session.role = null;
  state.session.userName = "";
  state.session.userId = null;
  state.activeTab = "login";
  saveState();
  render();
}

function renderTopChrome() {
  document.getElementById("top-company-name").textContent = state.company.name || "Freisam App";
  var initials = (state.company.name || "FS")
    .split(/\s+/)
    .slice(0, 2)
    .map(function(w) { return w[0] || ""; })
    .join("")
    .toUpperCase() || "FS";
  document.getElementById("top-logo").textContent = initials;

  var banner = document.getElementById("greeting-banner");
  if (state.session.role) {
    banner.style.display = "flex";
    var roleLabel =
      state.session.role === "adm_master" ? "ADM Master" :
      state.session.role === "adm_2" ? "2o Admin" :
      state.session.role === "clb" ? "Colaborador (CLB)" : "Cliente";
    document.getElementById("greeting-text").textContent =
      "Bem-vindo, " + state.session.userName + " - Perfil: " + roleLabel;
  } else {
    banner.style.display = "none";
  }

  var nav = document.getElementById("main-nav");
  var buttons = [
    { id: "login", label: "Acesso / PIN" },
    { id: "client", label: "Painel Cliente" },
    { id: "adm", label: "Painel ADM" }
  ];
  nav.innerHTML = buttons.map(function(b) {
    return '<button class="nav-btn ' + (state.activeTab === b.id ? "active" : "") + '" onclick="setTab(\'' + b.id + '\')">' + b.label + '</button>';
  }).join("");
}

function render() {
  try {
    renderTopChrome();
    var container = document.getElementById("view-container");
    if (state.activeTab === "client") {
      container.innerHTML = renderClientView();
    } else if (state.activeTab === "adm") {
      container.innerHTML = renderAdmView();
    } else {
      container.innerHTML = renderLoginView();
    }
    window.scrollTo({ top: 0, behavior: "instant" });
  } catch (err) {
    localStorage.removeItem(STORAGE_KEY);
    state = createInitialState();
    renderTopChrome();
    document.getElementById("view-container").innerHTML = renderLoginView();
  }
}

function renderLoginView() {

    return '<option value="' + c.id + '">' + escapeHtml(c.name) + ' - ' + escapeHtml(c.city) + ' (Desde ' + escapeHtml(c.since) + ')</option>';

      '<div class="field-group">' +
        '<label for="pin-input">PIN de acesso</label>' +
        '<input id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="Ex.: 1111" onkeydown="if(event.key===\'Enter\') loginByPin()">' +

      '<div class="btn-row">' +
        '<button class="btn btn-primary btn-block" onclick="loginByPin()">Entrar com PIN</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">Acesso do Cliente ou Solicitacao</div>' +
      '<p class="muted">Entre como cliente cadastrado ou envie pedido de acesso (aprovado diretamente na Caixa de Avisos do ADM).</p>' +
      '<div class="field-group">' +
        '<label for="client-select">Cliente cadastrado</label>' +
        '<select id="client-select">' + clientOptions + '</select>' +
      '</div>' +
      '<button class="btn btn-secondary btn-block" onclick="loginAsClient()">Abrir Painel do Cliente</button>' +

      '<div class="card-title">Solicitar novo acesso de cliente</div>' +
      '<div class="field-group"><label for="req-client-name">Nome / Estabelecimento</label><input id="req-client-name" type="text" placeholder="Ex.: Mercado Sao Jorge"></div>' +
      '<div class="field-group"><label for="req-client-city">Cidade</label><input id="req-client-city" type="text" placeholder="Ex.: Campinas"></div>' +
      '<div class="field-group"><label for="req-client-phone">WhatsApp</label><input id="req-client-phone" type="text" placeholder="Ex.: 5511999998888"></div>' +
      '<button class="btn btn-warn btn-block" onclick="requestClientAccess()">Enviar solicitacao para Caixa de Avisos</button>' +

}

function loginByPin() {
  var pin = (document.getElementById("pin-input").value || "").trim();
  var user = state.users.find(function(u) { return u.active && u.pin === pin; });
  if (!user) {
    openModal("PIN nao encontrado", "<p>Nenhum usuario ativo encontrado com o PIN informado.</p><p class='muted'>Dica de teste: ADM Master = 1111, 2o Admin = 2222, Colaborador = 3333.</p>");
    return;
  }
  state.session.role = user.role;
  state.session.userName = user.name;
  state.session.userId = user.id;

  var today = new Date();
  var dd = String(today.getDate()).padStart(2, "0");
  var mm = String(today.getMonth() + 1).padStart(2, "0");
  var todayDm = dd + "/" + mm;
  var bdays = state.users.filter(function(u) { return u.birthday === todayDm; });

  state.activeTab = "adm";
  saveState();
  render();

  if (bdays.length > 0) {
    openModal("Aniversario do dia", "<p>Hoje e aniversario de: <strong>" + bdays.map(function(b) { return escapeHtml(b.name); }).join(", ") + "</strong>!</p>");
  }
}

function loginAsClient() {
  var id = document.getElementById("client-select").value;
  var cli = state.clients.find(function(c) { return c.id === id; });
  if (!cli) return;
  state.session.role = "client";
  state.session.userName = cli.name;
  state.session.userId = cli.id;
  state.session.clientSince = cli.since;
  state.activeTab = "client";
  saveState();
  render();
}

function requestClientAccess() {
  var name = (document.getElementById("req-client-name").value || "").trim();
  var city = (document.getElementById("req-client-city").value || "").trim();
  var phone = (document.getElementById("req-client-phone").value || "").trim();
  if (!name) {
    openModal("Atencao", "<p>Informe o nome do cliente ou estabelecimento.</p>");
    return;
  }
  state.notices.unshift({
    id: "n_" + Date.now(),
    title: "Solicitacao de acesso de cliente",
    text: name + " (" + (city || "Cidade nao informada") + ") solicitou acesso. WhatsApp: " + (phone || "nao informado") + ".",
    priority: "urgent",
    requiresAccessApproval: true,
    pendingClientName: name,
    pendingCity: city || "Nao informada",
    pendingPhone: phone || ""
  });
  saveState("Novo aviso de acesso enviado");
  openModal("Solicitacao enviada", "<p>Seu pedido foi enviado para a <strong>Caixa de Avisos</strong> do ADM para liberacao direta.</p>");
}

function renderClientView() {
  var activeClient = state.clients.find(function(c) { return c.id === state.session.userId; }) || state.clients[0];
  var sinceDate = activeClient ? activeClient.since : state.session.clientSince;

  var days = [];
  for (var d = 1; d <= 30; d++) days.push(d);

  var calHtml = days.map(function(dayNum) {
    var ev = state.calendarEvents.find(function(e) { return e.day === dayNum; });
    var cls = ev ? (ev.type === "holiday" ? "cal-day holiday" : "cal-day delivery") : "cal-day";
    return '<div class="' + cls + '" title="' + (ev ? escapeHtml(ev.label) : "") + '">' + dayNum + '</div>';
  }).join("");

  var prodHtml = sortedProducts.map(function(p) {
    var unitPrice = p.cost * (1 + (p.margin || 0) / 100);
    return '' +
      '<div class="list-row client-prod-item" data-search="' + escapeHtml((p.name + " " + p.category).toLowerCase()) + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">' +
          '<strong>' + escapeHtml(p.name) + '</strong>' +
          '<span class="badge badge-ok">' + formatBRL(unitPrice) + ' / ' + escapeHtml(p.unit) + '</span>' +
        '</div>' +
        '<div class="muted">' + escapeHtml(p.category) + '</div>' +
        '<div class="qty-box">' +
          '<button class="btn btn-secondary btn-sm" onclick="stepClientQty(\'' + p.id + '\', -1)">-</button>' +
          '<input id="cqty_' + p.id + '" type="number" min="0" value="0" aria-label="Quantidade de ' + escapeHtml(p.name) + '">' +
          '<button class="btn btn-secondary btn-sm" onclick="stepClientQty(\'' + p.id + '\', 1)">+</button>' +
        '</div>' +
      '</div>';
  }).join("");

  return '' +
    '<div class="card">' +
      '<div class="card-title">' + escapeHtml(clientName) + '</div>' +
      '<div class="muted">Cliente desde ' + escapeHtml(sinceDate) + ' - Pedidos ate as 15h</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">Calendario de Entregas e Feriados</div>' +
      '<div class="muted">Verde = entrega programada - Vermelho = feriado</div>' +
      '<div class="cal-grid">' + calHtml + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">Calculadora Rapida</div>' +
      '<div class="field-group">' +
        '<label for="calc-expr">Expressao (ex.: 12*25 + 40)</label>' +
        '<input id="calc-expr" type="text" placeholder="Digite valores e operadores" onkeydown="if(event.key===\'Enter\') runCalc()">' +
      '</div>' +
      '<button class="btn btn-secondary btn-sm" onclick="runCalc()">Calcular</button>' +
      '<span id="calc-result" style="margin-left:10px;font-weight:800;"></span>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">Central de Servicos (Grade 3 + 3)</div>' +
      '<div class="client-grid-6">' +
        '<div class="square-tile" onclick="openClientNoticesModal()"><span>Avisos</span><span class="badge badge-warn">' + state.notices.length + '</span></div>' +
        '<div class="square-tile" onclick="openClientScheduledModal()"><span>Entrega Agendada</span><span class="badge badge-ok">' + state.scheduledDeliveries.length + '</span></div>' +
        '<div class="square-tile" onclick="openModal(\'Alarmes e Horario de Corte\', \'<p>Limite diario para pedidos: <strong>15h00</strong>.</p>\')"><span>Alarmes (15h)</span><span class="badge badge-ok">Ativo</span></div>' +
        '<div class="square-tile" onclick="openClientReclameModal()"><span>Sugestoes / Reclames</span><span class="badge badge-warn">WhatsApp</span></div>' +
        '<div class="square-tile" onclick="openClientHistoryModal()"><span>Historico de Pedidos</span><span class="badge badge-ok">' + state.orders.length + '</span></div>' +
        '<div class="square-tile" onclick="openClientContactsModal()"><span>Contatos</span><span class="badge badge-ok">' + state.contacts.length + '</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">Catalogo por Ordem Alfabetica</div>' +
      '<div class="field-group"><label for="cat-search">Buscar produto ou categoria</label><input id="cat-search" type="text" placeholder="Digite para filtrar..." oninput="filterClientCatalog()"></div>' +
      '<div id="client-catalog-list">' + prodHtml + '</div>' +
      '<div class="field-group" style="margin-top:10px;">' +
        '<label for="order-priority">Prioridade do pedido</label>' +
        '<select id="order-priority"><option value="normal">Normal (Amarelo)</option><option value="urgent">Urgente (Vermelho)</option></select>' +
      '</div>' +
      '<button class="btn btn-primary btn-block" onclick="sendClientOrderWhatsApp()">Concluir e Enviar Pedido via WhatsApp</button>' +
    '</div>' +
    '<div class="insta-banner" onclick="window.open(\'' + escapeHtml(state.company.instagramUrl || "https://instagram.com") + '\', \'_blank\')">' +
      '<div><div style="font-size:15px;">Siga no Instagram - Base 10%</div><div style="font-size:12px;font-weight:600;opacity:0.95;">Novidades, ofertas e bastidores</div></div>' +
      '<span>Abrir -&gt;</span>' +
    '</div>';

function runCalc() {
  var expr = (document.getElementById("calc-expr").value || "").trim();
  var out = document.getElementById("calc-result");
  if (!/^[0-9+\-*/().\s]+$/.test(expr)) {
    out.textContent = "Expressao invalida";
    return;
  }
  try {
    var val = Function('"use strict"; return (' + expr + ');')();
    out.textContent = Number.isFinite(val) ? "= " + val : "Erro";
  } catch (e) {
    out.textContent = "Erro";
  }
}

function filterClientCatalog() {
  var q = (document.getElementById("cat-search").value || "").toLowerCase().trim();
  document.querySelectorAll(".client-prod-item").forEach(function(el) {
    var hay = el.getAttribute("data-search") || "";
    el.style.display = hay.indexOf(q) !== -1 ? "block" : "none";
  });
}

function stepClientQty(prodId, delta) {
  var inp = document.getElementById("cqty_" + prodId);
  if (!inp) return;
  inp.value = Math.max(0, (parseInt(inp.value, 10) || 0) + delta);
}

function sendClientOrderWhatsApp() {
  var selected = [];
  var total = 0;
  state.products.forEach(function(p) {
    var inp = document.getElementById("cqty_" + p.id);
    var qty = inp ? (parseFloat(inp.value) || 0) : 0;
    if (qty > 0) {
      var unitPrice = p.cost * (1 + (p.margin || 0) / 100);
      var sub = qty * unitPrice;
      total += sub;
      selected.push(qty + " " + p.unit + " de " + p.name + " (" + formatBRL(sub) + ")");
    }
  });
  if (selected.length === 0) {
    openModal("Pedido vazio", "<p>Selecione pelo menos 1 item antes de enviar.</p>");
    return;
  }
  var prio = document.getElementById("order-priority").value;
  var prioText = prio === "urgent" ? "URGENTE (Vermelho)" : "NORMAL (Amarelo)";
  var clientLabel = state.session.role === "client" ? state.session.userName : "Cliente";

  state.orders.unshift({
    id: "ord_" + Date.now(),
    date: new Date().toLocaleDateString("pt-BR"),
    clientName: clientLabel,
    priority: prio,
    total: Number(total.toFixed(2)),
    paid: false,
    pixCode: state.company.pixKeyDefault || "00000000000",
    items: selected
  });
  saveState("Pedido registrado");

  var rawMsg = "*Pedido - " + state.company.name + "*\nCliente: " + clientLabel + "\nPrioridade: " + prioText + "\nItens:\n- " + selected.join("\n- ") + "\n*Total estimado: " + formatBRL(total) + "*";
  var phone = state.company.phoneWhats || "5500000000000";
  window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(rawMsg), "_blank");
}

function openClientNoticesModal() {
  if (state.notices.length === 0) {
    openModal("Avisos", "<p class='muted'>Nenhum aviso pendente no momento.</p>");
    return;
  }
  var html = state.notices.map(function(n) {
    return '' +
      '<div class="notice-item ' + (n.priority === "urgent" ? "urgent" : "") + '">' +
        '<strong>' + escapeHtml(n.title) + '</strong>' +
        '<p style="margin:4px 0 8px 0;">' + escapeHtml(n.text) + '</p>' +
        '<button class="btn btn-primary btn-sm" onclick="ackNotice(\'' + n.id + '\')">Estou ciente</button>' +
      '</div>';
  }).join("");
  openModal("Caixa de Avisos", html);
}

function ackNotice(noticeId) {
  var idx = state.notices.findIndex(function(n) { return n.id === noticeId; });
  if (idx === -1) return;
  var notice = state.notices[idx];

  if (notice.requiresAccessApproval && (state.session.role === "adm_master" || state.session.role === "adm_2")) {
    closeModal();
    openModal(
      "Liberar acesso do cliente?",
      '' +
        '<p>Voce marcou <strong>Estou ciente</strong> no pedido de acesso:</p>' +
        '<p><strong>' + escapeHtml(notice.pendingClientName) + '</strong> - ' + escapeHtml(notice.pendingCity) + '</p>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" onclick="decideClientAccess(\'' + notice.id + '\', true)">Sim - Liberar acesso</button>' +
          '<button class="btn btn-danger" onclick="decideClientAccess(\'' + notice.id + '\', false)">Nao - Recusar</button>' +
        '</div>'
    );
    return;
  }

  state.notices.splice(idx, 1);
  saveState("Aviso confirmado");
  openClientNoticesModal();
  if (state.activeTab === "adm") render();
}

function decideClientAccess(noticeId, approved) {
  var idx = state.notices.findIndex(function(n) { return n.id === noticeId; });
  if (idx === -1) return;
  var n = state.notices[idx];
  if (approved) {
    state.clients.push({
      id: "c_" + Date.now(),
      name: n.pendingClientName || "Novo Cliente",
      city: n.pendingCity || "Nao informada",
      routeId: state.routes[0] ? state.routes[0].id : "r_1",
      since: new Date().toLocaleDateString("pt-BR"),
      approved: true,
      phone: n.pendingPhone || ""
    });
  }
  state.notices.splice(idx, 1);
  saveState(approved ? "Acesso liberado" : "Acesso recusado");
  closeModal();
  render();
}

function openClientScheduledModal() {
  var html = state.scheduledDeliveries.length
    ? state.scheduledDeliveries.map(function(s) { return '<div class="list-row"><strong>' + escapeHtml(s.date) + '</strong> - ' + escapeHtml(s.clientName) + '<div class="muted">' + escapeHtml(s.summary) + '</div></div>'; }).join("")
    : "<p class='muted'>Nenhuma entrega agendada.</p>";
  openModal("Entregas Agendadas", html);
}

    '<div class="field-group"><label for="rec-prio">Classificacao</label><select id="rec-prio"><option value="normal">Normal (Amarelo)</option><option value="urgent">Urgente (Vermelho)</option></select></div>' +

  window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(rawText), "_blank");
}

function openClientHistoryModal() {

function openClientContactsModal() {
  var html = state.contacts.map(function(ct) {
    return '<div class="list-row" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;"><div><strong>' + escapeHtml(ct.name) + '</strong><div class="muted">' + escapeHtml(ct.role) + '</div></div><a class="btn btn-primary btn-sm" href="https://wa.me/' + escapeHtml(ct.phone) + '" target="_blank">WhatsApp</a></div>';
  }).join("");
  openModal("Contatos da Empresa", html);
}

function renderAdmView() {
  var role = state.session.role;
  var isClb = role === "clb";
  var currentUser = state.users.find(function(u) { return u.id === state.session.userId; });

  var visibleBalloons = state.admBalloons.filter(function(b) {
    if (!role || role === "adm_master" || role === "adm_2") return true;
    if (isClb) {
      if (b.isSecurity) return false;
      if (currentUser && Array.isArray(currentUser.balloons)) {
        return currentUser.balloons.indexOf(b.id) !== -1;
      }
      return !!b.clbAllowed;
    }
    return !b.isSecurity;
  });

  var urgentNoticesCount = state.notices.filter(function(n) { return n.requiresAccessApproval || n.priority === "urgent"; }).length;

  var tilesHtml = visibleBalloons.map(function(b) {
    return '<div class="balloon-tile ' + (b.isSecurity ? "security-tile" : "") + '" onclick="openAdmBalloon(\'' + b.id + '\')"><div class="balloon-title">' + escapeHtml(b.title) + '</div><div class="balloon-tag">' + escapeHtml(b.tag || "") + '</div></div>';
  }).join("");

  return '' +
    '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">' +
        '<div><div class="card-title">Painel Administrativo (Grade 4 Colunas)</div><div class="muted">Toque para abrir - Caixa de avisos: ' + state.notices.length + ' aviso(s) ' + (urgentNoticesCount ? "(" + urgentNoticesCount + " urgente/acesso)" : "") + '</div></div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-warn btn-sm" onclick="openClientNoticesModal()">Caixa de Avisos (' + state.notices.length + ')</button>' +
          (!isClb ? '<button class="btn btn-secondary btn-sm" onclick="openAddBalloonModal()">+ Novo Balao</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="adm-grid" style="margin-top:12px;">' + tilesHtml + '</div>' +
    '</div>';
}

function openAddBalloonModal() {
  openModal("Novo Balao na Grade ADM", '' +
    '<div class="field-group"><label for="nb-title">Titulo do balao</label><input id="nb-title" type="text" placeholder="Ex.: Conferencia de Caixa"></div>' +
    '<div class="field-group"><label for="nb-tag">Subtitulo / tag curta</label><input id="nb-tag" type="text" placeholder="Ex.: Diario"></div>' +
    '<button class="btn btn-primary btn-block" onclick="saveNewBalloon()">Adicionar a Grade</button>'
  );
}

function saveNewBalloon() {
  var title = (document.getElementById("nb-title").value || "").trim();
  var tag = (document.getElementById("nb-tag").value || "Personalizado").trim();
  if (!title) return;
  state.admBalloons.push({
    id: "b_custom_" + Date.now(),
    title: title,
    tag: tag,
    clbAllowed: false,
    isCustom: true
  });
  saveState("Balao adicionado");
  closeModal();
  render();
}

function openAdmBalloon(balloonId) {
  var b = state.admBalloons.find(function(x) { return x.id === balloonId; });
  if (!b) return;
  switch (b.id) {
    case "b_rotas": return openRotasPrepModal();
    case "b_veiculos": return openVeiculosModal();
    case "b_retornos": return openRetornosRotaModal();
    case "b_produtos": return openProdutosModal();
    case "b_compras": return openComprasModal();
    case "b_vendas": return openVendasModal();
    case "b_despesas": return openDespesasModal();
    case "b_receber": return openReceberModal();
    case "b_fornecedor": return openFornecedorModal();
    case "b_notaspagas": return openNotasPagasModal();
    case "b_programadas": return openProgramadasModal();
    case "b_reclames": return openReclamesAdmModal();
    case "b_estoque": return openEstoqueModal();
    case "b_colaboradores": return openColaboradoresModal();
    case "b_mei": return openMeiModal();
    case "b_relatorio": return openRelatorioA4Modal();
    case "b_seguranca": return openSecurityGateModal();
    default:
      openModal(b.title, "<p>Balao personalizado <strong>" + escapeHtml(b.title) + "</strong> pronto para uso operacional.</p>");
  }
}

function openRotasPrepModal() {
  var route = state.routes[0];
  var queueHtml = (route.queue || []).map(function(q, idx) {
    return '' +
      '<div class="list-row" style="border-left:4px solid ' + (q.done ? "var(--ok)" : (idx === 0 ? "var(--accent)" : "#c5d1ca")) + ';">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
          '<strong>#' + (idx + 1) + ' ' + escapeHtml(q.clientName) + ' (' + escapeHtml(q.city) + ')</strong>' +
          '<span class="badge ' + (q.done ? "badge-ok" : "badge-warn") + '">' + (q.done ? "Separado OK" : "Na fila") + '</span>' +
        '</div>' +
        '<div>Item: <strong>' + escapeHtml(q.productName) + '</strong> - Qtd: <strong>' + q.qty + '</strong></div>' +
        '<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="toggleQueueDone(\'' + q.id + '\')">' + (q.done ? "Desmarcar" : "Marcar Separado") + '</button></div>' +
      '</div>';
  }).join("");

  openModal("Rotas & Prep Carga", '' +
    '<p><strong>Rota ativa:</strong> ' + escapeHtml(route.name) + ' - Destino final: <strong>' + escapeHtml(route.lastCity) + '</strong></p>' +
    '<div class="btn-row">' +
      '<button class="btn btn-primary btn-sm" onclick="startRouteDelivery()">Iniciar Rota / Navegar</button>' +
      '<button class="btn btn-secondary btn-sm" onclick="finishLoadTo80mm()">Concluir Carga (Fila PC 80mm)</button>' +
    '</div>' +
    '<hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">' +
    queueHtml
  );
}

function toggleQueueDone(qId) {
  var item = state.routes[0].queue.find(function(x) { return x.id === qId; });
  if (!item) return;
  item.done = !item.done;
  saveState("Separacao atualizada");
  openRotasPrepModal();
}

function startRouteDelivery() {
  var route = state.routes[0];
  var kmInput = prompt("Informe a KM do painel para iniciar a rota (" + route.vehiclePlate + "):", state.vehicles[0] ? state.vehicles[0].km : "0");
  if (kmInput === null) return;
  var kmNum = parseInt(kmInput, 10);
  if (Number.isFinite(kmNum) && kmNum > 0 && state.vehicles[0]) {
    state.vehicles[0].km = kmNum;
  }
  route.status = "Em rota";
  saveState("Rota iniciada");
  closeModal();
  window.open("https://waze.com/ul?q=" + encodeURIComponent(route.lastCity) + "&navigate=yes", "_blank");
}

function finishLoadTo80mm() {
  var route = state.routes[0];
  var lines = route.queue.map(function(q) { return (q.done ? "[X]" : "[ ]") + " " + q.qty + "x " + q.productName + " (" + q.clientName + ")"; }).join("<br>");
  triggerPrintHtml('<div style="text-align:center;"><strong>' + escapeHtml(state.company.name) + '</strong><br>ROMANEIO DE CARGA (80mm)</div><hr><div>' + lines + '</div>', true);
}

function openVeiculosModal() {
  var html = state.vehicles.map(function(v) {
    return '<div class="list-row"><strong>' + escapeHtml(v.model) + ' (' + escapeHtml(v.year) + ') - Placa ' + escapeHtml(v.plate) + '</strong><div>KM painel: <strong>' + v.km + ' km</strong> - IPVA: ' + escapeHtml(v.ipvaDue) + ' - Troca de oleo: ' + v.oilDueKm + ' km</div></div>';
  }).join("");
  openModal("Veiculos & Frota", html);
}

function openRetornosRotaModal() {
  var html = state.returns.map(function(r) {
    return '<div class="list-row" style="cursor:pointer;" onclick="window.open(\'https://waze.com/ul?q=' + encodeURIComponent(r.city) + '&navigate=yes\',\'_blank\')"><strong>' + escapeHtml(r.clientName) + ' (' + escapeHtml(r.city) + ')</strong> - <span class="badge badge-warn">' + escapeHtml(r.status) + '</span><div class="muted">' + escapeHtml(r.reason) + ' - Toque para abrir no Waze</div></div>';
  }).join("");
  openModal("Retornos & Acompanhar Rota", html);
}

function openProdutosModal() {
  var html = state.products.map(function(p) {
    var suggested = p.cost * (1 + (p.margin || 0) / 100);
    return '<div class="list-row"><strong>[' + escapeHtml(p.code) + '] ' + escapeHtml(p.name) + '</strong> - Estoque: ' + p.stock + ' ' + escapeHtml(p.unit) + ' - Sugerido: <strong>' + formatBRL(suggested) + '</strong></div>';
  }).join("");
  openModal("Produtos & Margem", html);
}

function openComprasModal() {
  var html = state.purchases.map(function(pu) {
    return '<div class="list-row"><strong>' + escapeHtml(pu.supplierName) + '</strong> - ' + escapeHtml(pu.itemName) + ' - <strong>' + formatBRL(pu.costTotal) + '</strong> (' + escapeHtml(pu.status) + ')</div>';
  }).join("");
  openModal("Compras de Fornecedores", html);
}

function openVendasModal() {
  var html = state.orders.map(function(o) {
    return '<div class="list-row"><strong>#' + escapeHtml(o.id) + '</strong> - ' + escapeHtml(o.clientName) + ' - <strong>' + formatBRL(o.total) + '</strong></div>';
  }).join("");
  openModal("Vendas", html);
}

function openDespesasModal() {
  var html = state.expenses.map(function(e) {
    return '<div class="list-row"><strong>' + escapeHtml(e.type) + '</strong> - ' + escapeHtml(e.category) + ' - <strong>' + formatBRL(e.amount) + '</strong></div>';
  }).join("");
  openModal("Despesas", html);
}

function openReceberModal() {
  var openOrders = state.orders.filter(function(o) { return !o.paid; });
  var html = openOrders.length
    ? openOrders.map(function(o) {
        return '<div class="list-row"><strong>#' + escapeHtml(o.id) + '</strong> - ' + escapeHtml(o.clientName) + ' - <strong>' + formatBRL(o.total) + '</strong><div class="btn-row"><button class="btn btn-primary btn-sm" onclick="settleOrder(\'' + o.id + '\')">Quitar Nota</button></div></div>';
      }).join("")
    : "<p class='muted'>Nenhuma nota em aberto.</p>";
  openModal("Notas a Receber", html);
}

function settleOrder(orderId) {
  var o = state.orders.find(function(x) { return x.id === orderId; });
  if (!o) return;
  o.paid = true;
  saveState("Nota quitada");
  openReceberModal();
}

function openFornecedorModal() {
  var html = state.suppliers.map(function(s) {
    return '<div class="list-row"><strong>' + escapeHtml(s.name) + '</strong><div class="muted">Itens: ' + escapeHtml((s.itemsSold || []).join(", ")) + '</div></div>';
  }).join("");
  openModal("Fornecedores", html);
}

function openNotasPagasModal() {
  var received = state.orders.filter(function(o) { return o.paid; });
  var paidSup = state.purchases.filter(function(p) { return p.status === "Paga"; });
  var html = '' +
    '<div class="card-title">Notas Recebidas</div>' +
    (received.length ? received.map(function(o) { return '<div class="list-row">#' + escapeHtml(o.id) + ' - ' + escapeHtml(o.clientName) + ' - ' + formatBRL(o.total) + '</div>'; }).join("") : "<p class='muted'>Nenhuma nota recebida.</p>") +
    '<div class="card-title" style="margin-top:10px;">Notas Pagas (Fornecedores)</div>' +
    (paidSup.length ? paidSup.map(function(p) { return '<div class="list-row">' + escapeHtml(p.supplierName) + ' - ' + formatBRL(p.costTotal) + '</div>'; }).join("") : "<p class='muted'>Nenhuma nota paga.</p>");
  openModal("Notas Pagas & Recebidas", html);
}

function openProgramadasModal() {
  var html = state.scheduledDeliveries.length
    ? state.scheduledDeliveries.map(function(s) { return '<div class="list-row"><strong>' + escapeHtml(s.date) + '</strong> - ' + escapeHtml(s.clientName) + '<div class="muted">' + escapeHtml(s.summary) + '</div></div>'; }).join("")
    : "<p class='muted'>Sem entregas programadas.</p>";
  openModal("Entregas Programadas", html);
}

function openReclamesAdmModal() {
  var html = '' +
    '<button class="btn btn-danger btn-sm" style="margin-bottom:10px;" onclick="clearAllReclames()">Limpar caixa de avisos / reclames</button>' +
    (state.reclames.length ? state.reclames.map(function(r) { return '<div class="notice-item"><strong>' + escapeHtml(r.author) + '</strong>: ' + escapeHtml(r.message) + '</div>'; }).join("") : "<p class='muted'>Sem registros.</p>");
  openModal("Reclames", html);
}

function clearAllReclames() {
  state.reclames = [];
  saveState("Reclames limpos");
  openReclamesAdmModal();
}

function openEstoqueModal() {
  var html = state.products.map(function(p) {
    return '<div class="list-row"><strong>[' + escapeHtml(p.code) + '] ' + escapeHtml(p.name) + '</strong> - Saldo: <strong>' + p.stock + ' ' + escapeHtml(p.unit) + '</strong></div>';
  }).join("");
  openModal("Estoque", html + '<button class="btn btn-primary btn-sm" onclick="printStockA4()">Imprimir A4</button> <button class="btn btn-secondary btn-sm" onclick="printStock80mm()">Imprimir 80mm</button>');
}

function printStockA4() {
  var rows = state.products.map(function(p) { return '<tr><td>' + escapeHtml(p.code) + '</td><td>' + escapeHtml(p.name) + '</td><td>' + p.stock + ' ' + escapeHtml(p.unit) + '</td></tr>'; }).join("");
  triggerPrintHtml('<h2>Estoque - ' + escapeHtml(state.company.name) + '</h2><table border="1" cellpadding="6" style="width:100%;border-collapse:collapse;"><tr><th>Cod</th><th>Produto</th><th>Saldo</th></tr>' + rows + '</table>', false);
}

function printStock80mm() {
  var lines = state.products.map(function(p) { return escapeHtml(p.name) + ': ' + p.stock + ' ' + escapeHtml(p.unit); }).join("<br>");
  triggerPrintHtml('<div style="text-align:center;"><strong>ESTOQUE 80mm</strong></div><hr>' + lines, true);
}

function openColaboradoresModal() {
  var html = '' +
    '<div class="btn-row" style="margin-bottom:12px;"><button class="btn btn-primary" onclick="openNewCollaboratorForm()">Novo</button><button class="btn btn-secondary" onclick="openEditCollaboratorPicker()">Editar</button></div>' +
    state.users.map(function(u) { return '<div class="list-row"><strong>' + escapeHtml(u.name) + '</strong> - ' + escapeHtml(u.functionRole || u.role) + ' - PIN: ' + escapeHtml(u.pin) + '</div>'; }).join("");
  openModal("Colaboradores", html);
}

function openNewCollaboratorForm() {
  openModal("Novo Colaborador", '' +
    '<div class="field-group"><label>Nome completo</label><input id="col-name" type="text"></div>' +
    '<div class="field-group"><label>PIN</label><input id="col-pin" type="text" inputmode="numeric"></div>' +
    '<div class="field-group"><label>Funcao</label><select id="col-func" onchange="document.getElementById(\'clt-box\').style.display = this.value===\'Padrao CLT\' ? \'block\' : \'none\'"><option value="Operacional">Operacional</option><option value="Padrao CLT">Padrao CLT</option></select></div>' +
    '<div id="clt-box" style="display:none;margin-bottom:10px;"><button class="btn btn-warn btn-sm" onclick="printCltChecklist80mm()">Imprimir Lista CLT (80mm)</button> <button class="btn btn-primary btn-sm" onclick="openGuidedCltWizard()">Cadastrar Padrao CLT (Proximo)</button></div>' +
    '<button class="btn btn-primary btn-block" onclick="saveNewCollaborator()">Salvar Colaborador</button>'
  );
}

function printCltChecklist80mm() {
  triggerPrintHtml('<div style="text-align:center;"><strong>DOCUMENTOS PADRAO CLT</strong></div><hr>[ ] RG / CPF<br>[ ] Residencia<br>[ ] CTPS Digital / PIS<br>[ ] ASO', true);
}

var CLT_STEPS = [
  { key: "nomeCompleto", label: "1. Nome completo" },
  { key: "cpf", label: "2. CPF" },
  { key: "rg", label: "3. RG / Orgao emissor" },
  { key: "pis", label: "4. PIS / NIS" },
  { key: "endereco", label: "5. Endereco completo" },
  { key: "cargoCbo", label: "6. Cargo e CBO" },
  { key: "salario", label: "7. Salario base (R$)" },
  { key: "jornada", label: "8. Jornada de trabalho" }
];
var cltIdx = 0;
var cltDraft = {};

function openGuidedCltWizard() {
  cltIdx = 0;
  cltDraft = {};
  renderCltStep();
}

function renderCltStep() {
  var st = CLT_STEPS[cltIdx];
  openModal("Cadastrar Padrao CLT (" + (cltIdx + 1) + "/" + CLT_STEPS.length + ")", '' +
    '<div class="field-group"><label>' + escapeHtml(st.label) + '</label><input id="clt-inp" type="text" value="' + escapeHtml(cltDraft[st.key] || "") + '" onkeydown="if(event.key===\'ArrowDown\'||event.key===\'Enter\'){event.preventDefault();nextCltStep();}"></div>' +
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="nextCltStep()">Proximo campo</button><button class="btn btn-primary btn-sm" onclick="nextCltStep()">Proximo</button></div>'
  );
  setTimeout(function() { var el = document.getElementById("clt-inp"); if (el) el.focus(); }, 50);
}

function nextCltStep() {
  var el = document.getElementById("clt-inp");
  if (el) cltDraft[CLT_STEPS[cltIdx].key] = el.value.trim();
  if (cltIdx < CLT_STEPS.length - 1) {
    cltIdx++;
    renderCltStep();
  } else {
    state.users.push({
      id: "u_clt_" + Date.now(),
      name: cltDraft.nomeCompleto || "Colaborador CLT",
      role: "clb",
      pin: String(Math.floor(1000 + Math.random() * 9000)),
      birthday: "01/01",
      functionRole: "Padrao CLT",
      active: true,
      balloons: ["b_rotas", "b_retornos"],
      cltData: Object.assign({}, cltDraft)
    });
    saveState("Ficha CLT salva");
    openModal("Ficha CLT Concluida", "<pre style='white-space:pre-wrap;'>" + escapeHtml(JSON.stringify(cltDraft, null, 2)) + "</pre>");
  }
}

function saveNewCollaborator() {
  var name = (document.getElementById("col-name").value || "").trim();
  var pin = (document.getElementById("col-pin").value || "").trim() || "4444";
  var func = document.getElementById("col-func").value;
  if (!name) return;
  state.users.push({ id: "u_" + Date.now(), name: name, role: "clb", pin: pin, birthday: "01/01", functionRole: func, active: true, balloons: ["b_rotas"] });
  saveState("Colaborador salvo");
  openColaboradoresModal();
}

function openEditCollaboratorPicker() {
  var html = state.users.map(function(u) {
    return '<div class="list-row" style="display:flex;justify-content:space-between;align-items:center;"><strong>' + escapeHtml(u.name) + '</strong><button class="btn btn-secondary btn-sm" onclick="promptEditUser(\'' + u.id + '\')">Editar</button></div>';
  }).join("");
  openModal("Editar Colaborador", html);
}

function promptEditUser(uid) {
  var u = state.users.find(function(x) { return x.id === uid; });
  if (!u) return;
  var n = prompt("Nome:", u.name);
  if (n && n.trim()) u.name = n.trim();
  var p = prompt("PIN:", u.pin);
  if (p && p.trim()) u.pin = p.trim();
  saveState("Atualizado");
  openColaboradoresModal();
}

function openMeiModal() {
  var limit = Number(state.company.meiLimitAnnual || 81000);
  var used = Number(state.company.meiUsedAnnual || 0);
  openModal("MEI & Nota de Transporte A4", '' +
    '<p>Limite anual: <strong>' + formatBRL(limit) + '</strong> - Utilizado: <strong>' + formatBRL(used) + '</strong></p>' +
    '<div class="field-group"><label>Valor original (R$)</label><input id="mei-val" type="number" step="0.01" value="500.00"></div>' +
    '<button class="btn btn-primary btn-block" onclick="generateMeiTransportA4()">Gerar Nota A4 (20%)</button>'
  );
}

function generateMeiTransportA4() {
  var base = parseFloat(document.getElementById("mei-val").value) || 0;
  var v20 = Number((base * 0.20).toFixed(2));
  var dest = state.routes[0] ? state.routes[0].lastCity : "Destino";
  triggerPrintHtml('<h2>NOTA DE TRANSPORTE A4</h2><p>Destino: ' + escapeHtml(dest) + ' - Valor 20%: <strong>' + formatBRL(v20) + '</strong></p>', false);
}

function openRelatorioA4Modal() {
  var gross = state.orders.reduce(function(s, o) { return s + Number(o.total || 0); }, 0);
  var exp = state.expenses.reduce(function(s, e) { return s + Number(e.amount || 0); }, 0);
  openModal("Relatorio Financeiro Diario (A4)", "<p>Vendas: <strong>" + formatBRL(gross) + "</strong> - Despesas: <strong>" + formatBRL(exp) + "</strong></p>");
}

function openSecurityGateModal() {
  openModal("Area de Seguranca - Criador", '' +
    '<p class="muted">Acesso exclusivo do Criador (Sigla + Senha + PIN).</p>' +
    '<div class="field-group"><label>Sigla</label><input id="sec-sigla" type="text" placeholder="CRI"></div>' +
    '<div class="field-group"><label>Senha</label><input id="sec-pass" type="password" placeholder="Senha"></div>' +
    '<div class="field-group"><label>PIN</label><input id="sec-pin" type="password" inputmode="numeric" placeholder="PIN"></div>' +
    '<button class="btn btn-primary btn-block" onclick="verifyCreatorSecurity()">Entrar</button>'
  );
}

function verifyCreatorSecurity() {
  var sigla = (document.getElementById("sec-sigla").value || "").trim().toUpperCase();
  var pass = (document.getElementById("sec-pass").value || "").trim();
  var pin = (document.getElementById("sec-pin").value || "").trim();
  if (sigla === state.creator.sigla.toUpperCase() && pass === state.creator.senha && pin === state.creator.pin) {
    openCreatorPanel();
  } else {
    openModal("Acesso negado", "<p>Credenciais do Criador invalidas.</p>");
  }
}

function openCreatorPanel() {
  openModal("Area de Seguranca do Criador", '' +
    '<div class="list-row"><strong>1. Editar o editor</strong><div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="editCreatorCreds()">Alterar Sigla/Senha/PIN</button></div></div>' +
    '<div class="list-row"><strong>2. Editar ADM Master</strong><div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="editAdm1Creds()">Alterar Nome/PIN ADM Master</button></div></div>' +
    '<div class="list-row"><strong>3. Editar empresa administradora</strong><div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="editCompanyInfo()">Alterar Nome/WhatsApp</button></div></div>' +
    '<div class="list-row"><strong>4. Redefinir o aplicativo</strong><div class="btn-row"><button class="btn btn-danger btn-sm" onclick="resetAppToZero()">Zerar para nova empresa</button></div></div>'
  );
}

function editCreatorCreds() {
  var s = prompt("Nova Sigla:", state.creator.sigla);
  var p = prompt("Nova Senha:", state.creator.senha);
  var n = prompt("Novo PIN:", state.creator.pin);
  if (s) state.creator.sigla = s.trim().toUpperCase();
  if (p) state.creator.senha = p.trim();
  if (n) state.creator.pin = n.trim();
  saveState("Credenciais do criador salvas");
}

function editAdm1Creds() {
  var adm1 = state.users.find(function(u) { return u.role === "adm_master"; }) || state.users[0];
  if (!adm1) return;
  var n = prompt("Nome ADM Master:", adm1.name);
  var p = prompt("PIN ADM Master:", adm1.pin);
  if (n) adm1.name = n.trim();
  if (p) adm1.pin = p.trim();
  saveState("ADM Master salvo");
}

function editCompanyInfo() {
  var n = prompt("Nome da empresa:", state.company.name);
  var w = prompt("WhatsApp (com DDI):", state.company.phoneWhats);
  if (n) state.company.name = n.trim();
  if (w) state.company.phoneWhats = w.trim();
  saveState("Empresa salva");
  renderTopChrome();
}

function resetAppToZero() {
  if (!confirm("Zerar dados do aplicativo para iniciar uma nova empresa?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = createInitialState();
  state.company.name = "Nova Empresa";
  saveState("Aplicativo redefinido");
  closeModal();
  render();
}

render();
</script>
</body>
</html>
